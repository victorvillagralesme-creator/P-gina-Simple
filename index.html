<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Página</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50">
 
  <input type="checkbox" id="menu-toggle" class="hidden peer"/>
 
  <nav class="bg-blue-600 shadow-lg px-6 py-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
 
      <a href="#" class="text-xl font-bold text-white">MiMarca</a>
 
      <div class="hidden md:flex gap-8">
        <a href="#" class="text-blue-100 hover:text-white font-medium transition">Inicio</a>
        <a href="#" class="text-blue-100 hover:text-white font-medium transition">Sobre mí</a>
        <a href="#" class="text-blue-100 hover:text-white font-medium transition">Proyectos</a>
        <a href="#" class="text-blue-100 hover:text-white font-medium transition">Contacto</a>
      </div>
 
      <label for="menu-toggle"
        class="md:hidden flex flex-col gap-1.5 p-2 rounded cursor-pointer hover:bg-blue-500 transition">
        <span class="block w-6 h-0.5 bg-white"></span>
        <span class="block w-6 h-0.5 bg-white"></span>
        <span class="block w-6 h-0.5 bg-white"></span>
      </label>
 
    </div>
 
    <div class="hidden peer-checked:flex flex-col gap-1 mt-4 border-t border-blue-500 pt-4 md:hidden">
      <a href="#" class="block px-3 py-2 text-blue-100 hover:text-white hover:bg-blue-500 rounded transition">Inicio</a>
      <a href="#" class="block px-3 py-2 text-blue-100 hover:text-white hover:bg-blue-500 rounded transition">Sobre mí</a>
      <a href="#" class="block px-3 py-2 text-blue-100 hover:text-white hover:bg-blue-500 rounded transition">Proyectos</a>
      <a href="#" class="block px-3 py-2 text-blue-100 hover:text-white hover:bg-blue-500 rounded transition">Contacto</a>
    </div>
 
  </nav>
 
  <main class="max-w-6xl mx-auto px-6 py-16 text-center">
    <h1 class="text-4xl font-bold text-blue-800 mb-4">Bienvenido</h1>
  </main>
 
</body>
</html>
